name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: bash scripts/patch-android.sh
      - run: npm run assets -- --android
      - run: npx cap sync android
      - name: Build debug + release (unsigned)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Sign release (only if keystore secret exists)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out CarControl-release.apk aligned.apk
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/CarControl-debug.apk
          [ -f CarControl-release.apk ] && cp CarControl-release.apk out/ || true
      - uses: actions/upload-artifact@v4
        with: { name: CarControl-apk, path: app/out/*.apk }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: app/out/*.apk }
